<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00523e" />
      <stop offset="50%" stop-color="#00694f" />
      <stop offset="100%" stop-color="#008a66" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00694f" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  <rect x="8" y="8" width="112" height="112" rx="30" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Outer Neural Hexagonal Ring Web -->
  <g opacity="0.35" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2 3">
    <polygon points="64,22 98,42 98,82 64,102 30,82 30,42" fill="none" />
  </g>

  <!-- Hexagonal Constellation Vertex Nodes -->
  <circle cx="64" cy="22" r="3" fill="#6ee7b7" opacity="0.7" />
  <circle cx="98" cy="42" r="3" fill="#6ee7b7" opacity="0.7" />
  <circle cx="98" cy="82" r="3" fill="#6ee7b7" opacity="0.7" />
  <circle cx="64" cy="102" r="3" fill="#6ee7b7" opacity="0.7" />
  <circle cx="30" cy="82" r="3" fill="#6ee7b7" opacity="0.7" />
  <circle cx="30" cy="42" r="3" fill="#6ee7b7" opacity="0.7" />

  <!-- Radiating Interconnect Lines to Center -->
  <line x1="64" y1="22" x2="64" y2="40" stroke="#6ee7b7" stroke-width="1.5" opacity="0.5" />
  <line x1="98" y1="42" x2="80" y2="52" stroke="#6ee7b7" stroke-width="1.5" opacity="0.5" />
  <line x1="30" y1="42" x2="48" y2="52" stroke="#6ee7b7" stroke-width="1.5" opacity="0.5" />

  <!-- Primary Geometric 'Y' Monogram & Circuit Tracks -->
  <!-- Left Branch -->
  <path d="M42 36 L64 64" stroke="url(#lineGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Branch -->
  <path d="M86 36 L64 64" stroke="url(#lineGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Central Stem -->
  <path d="M64 64 L64 92" stroke="url(#lineGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Secondary Inner Circuit Core Accent -->
  <path d="M52 42 L64 57 L76 42" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <line x1="64" y1="62" x2="64" y2="84" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Terminal Computational Circuit Nodes -->
  <circle cx="42" cy="36" r="4.5" fill="#ffffff" stroke="#00523e" stroke-width="1.5" />
  <circle cx="86" cy="36" r="4.5" fill="#ffffff" stroke="#00523e" stroke-width="1.5" />
  <circle cx="64" cy="92" r="4.5" fill="#ffffff" stroke="#00523e" stroke-width="1.5" />

  <!-- Central Nexus Core Spark -->
  <circle cx="64" cy="64" r="5" fill="url(#glowGrad)" />
  <circle cx="64" cy="64" r="2" fill="#ffffff" />
</svg>
